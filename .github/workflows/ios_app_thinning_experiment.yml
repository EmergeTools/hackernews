name: iOS App Thinning Experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app_thinning:
    if: >-
      github.head_ref == 'test/app-thinning-experiment' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26

    defaults:
      run:
        working-directory: ./ios

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.10
          bundler-cache: true
          working-directory: ios

      - name: Setup gems
        run: exec ../.github/scripts/ios/setup.sh

      - name: Decode signing certificate into a file
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_SIGNING_KEY_BASE64 }}
        run: printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > signing-cert.p12

      - name: Run app thinning export experiment
        run: bundle exec fastlane ios test_app_thinning_exports
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE_PATH: signing-cert.p12
          CONFIGURATION: Release

      - name: Add results to job summary
        if: always()
        run: |
          if [[ -f build/app-thinning-experiment/summary.md ]]; then
            cat build/app-thinning-experiment/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The experiment stopped before producing a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove signing certificate
        if: always()
        run: rm -f signing-cert.p12
