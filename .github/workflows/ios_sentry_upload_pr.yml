name: Sentry iOS PR Size Analysis

on:
  pull_request:
    branches: [main]
    paths: [ios/**]

jobs:
  size_analysis:
    runs-on: macos-26

    defaults:
      run:
        working-directory: ./ios

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout sentry-cli
        uses: actions/checkout@v6
        with:
          repository: getsentry/sentry-cli
          ref: c596fcddd616867b6c6cdfa11f9853dc889a585a
          path: sentry-cli

      - name: Build sentry-cli
        working-directory: ${{ github.workspace }}/sentry-cli
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

      - name: Set up Ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.10
          bundler-cache: true
          working-directory: ios

      - name: Setup gems
        run: exec ../.github/scripts/ios/setup.sh

      - name: Decode signing certificate into a file
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_SIGNING_KEY_BASE64 }}
        run: |
          echo $CERTIFICATE_BASE64 | base64 --decode > signing-cert.p12

      - name: Build Release app and upload thinned XCArchive to Sentry
        run: bundle exec fastlane ios build_upload_thinned_sentry_size_analysis
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE_PATH: signing-cert.p12
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SENTRY_AUTH_TOKEN }}
          SENTRY_CLI_PATH: ${{ github.workspace }}/sentry-cli/target/aarch64-apple-darwin/release/sentry-cli
          SENTRY_LOG_LEVEL: debug
          SENTRY_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SENTRY_AUTH_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CONFIGURATION: Release
